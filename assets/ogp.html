<!--
  OGP画像（assets/ogp.png、1200x630）の元データ。ゲーム本体とは無関係で、
  index.html からは読み込まれない。SNSカードの絵柄を変えたいときはこれを編集し、
  下のコマンドで焼き直す（2倍で描いてから縮小するとエッジがなめらかになる）。

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --force-device-scale-factor=2 \
      --window-size=1200,630 --hide-scrollbars \
      --screenshot=assets/ogp@2x.png assets/ogp.html
    python3 -c "from PIL import Image; \
      Image.open('assets/ogp@2x.png').convert('RGB') \
      .resize((1200,630), Image.LANCZOS).save('assets/ogp.png', optimize=True)"

  配色は src/config.js の THEME に合わせてある（コート #2b6cb0 ／ ボール #d8f24a ／
  背景 #0b1a2b ／ ライン #eef3f8）。THEMEを変えたらこちらも合わせること。
-->
